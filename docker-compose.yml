version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mobile_user_db
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: Mobile_User_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appPass123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobile_user_web
    container_name: mobile_user_web
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./Mobile_User:/var/www/html
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    container_name: mobile_user_mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mobile_user_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
# Username: appuser
# Password: appPass123 
# http://localhost:8082/index.php?route=/
# to go to the database in the  terminal, use the following command:
# docker exec -it mobile_user_db mysql -uappuser -p
volumes:
  db_data:

