server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8087}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:mobile_user_springboot_dev}?connectionTimeZone=UTC
    username: ${DB_USER:mobile_user_springboot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
app:
  url: ${APP_URL:http://localhost:8087}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@mobileuser.test}
springdoc:
  swagger-ui:
    path: /docs
    url: /openapi.json
    csrf:
      enabled: true
